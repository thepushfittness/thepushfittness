services:
  - type: web
    name: pushfitness
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: pushfitness-data
      mountPath: /app/server/data
      sizeGB: 1
